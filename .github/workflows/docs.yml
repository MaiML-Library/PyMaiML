name: Deploy docs

# PyMaiML_docs_auto_deploy.md の方針に基づく、GitHub Pages Actionsデプロイ
# 方式。以前の `mkdocs gh-deploy`(gh-pagesブランチへのpush)方式から、
# ビルド成果物をPages artifactとしてアップロードし、
# actions/deploy-pages で直接デプロイする方式に切り替えた。gh-pages
# ブランチを成果物置き場として管理する必要がなくなる。
#
#   main へ push / merge
#           ↓
#   GitHub Actions
#           ↓
#   Python環境をセットアップ / pip install -e ".[docs]"
#           ↓
#   mkdocs build --strict (mkdocstringsによるAPI Reference生成を含む)
#           ↓
#   site/ を Pages artifact としてアップロード
#           ↓
#   GitHub Pages へ deploy
#
# pull_request時は build job(mkdocs build --strict によるビルド確認)
# だけを実行し、deploy jobはmainへのpush時のみ実行する(PRの内容を本番
# Pagesへデプロイしてしまわないようにするためのガード)。
#
# GitHub側で最初に一度だけ必要な設定:
#   Settings > Pages > Build and deployment > Source を
#   "GitHub Actions" にする(この設定自体はワークフローからは自動化
#   できない -- GitHub Pagesの仕様上、必ず人が一度選ぶ必要がある)。
# それ以降は、mainへのpush/mergeのたびに完全自動でデプロイされる。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -e ".[docs]"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
