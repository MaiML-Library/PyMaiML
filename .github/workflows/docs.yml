name: Docs

# API Reference(MkDocs + mkdocstrings)のビルド確認とデプロイ。
#
#   - push (main) / pull_request: `mkdocs build --strict` でビルドが
#     壊れていないか(docstringの構文エラー・pymdownx.snippetsの参照切れ
#     など)を確認するだけ(デプロイはしない)。
#   - main への push 時のみ、ビルド結果を gh-pages ブランチへデプロイする。
#     このワークフローが行うのは gh-pages ブランチの作成/更新までで、
#     実際にサイトとして公開するには、リポジトリの Settings > Pages で
#     公開ソースを "Deploy from a branch" / gh-pages ブランチに設定する
#     作業が別途必要(まだ有効化していない場合、そこだけ手動で行うこと)。
#     有効化すると https://maiml-library.github.io/PyMaiML/ で閲覧できる。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # gh-pagesブランチへのpushに必要(mainへのpush時のみ使用)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mkdocs gh-deploy(ghp-import)がgitログを参照するため

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and docs dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Configure git identity for gh-deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
