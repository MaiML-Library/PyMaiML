[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymaiml"
version = "0.1.0"
description = "MaiML (JIS K 0200) Python SDK -- built on the MaiML-Domain foundational domain model"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "MaiML-Library"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "maiml-domain @ git+https://github.com/MaiML-Library/MaiML-Domain.git@v0.2.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/MaiML-Library/PyMaiML"
Repository = "https://github.com/MaiML-Library/PyMaiML"

[tool.setuptools.packages.find]
include = ["pymaiml*"]

[tool.setuptools.package-data]
pymaiml = ["schema/MaiML-Schema-1_0/*.xsd", "schema/MaiML-Schema-1_0/*.txt"]
