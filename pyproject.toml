[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymaiml"
version = "0.1.0"
description = "MaiML (JIS K 0200) Python SDK -- built on the MaiML-Domain foundational domain model"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "MaiML-Library"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
# NOTE: PyPIへ公開する場合、この direct reference(git+URL)依存はそのままでは
# 使えません。PyPAの仕様上、public index server はアップロードされた
# distributionの依存関係に direct reference を含めることを許可すべきでは
# ないとされており(PEP 508 "Direct References"节、PyPAのdirect
# reference依存に関する方針を参照)、実際PyPIへのアップロードもこの形式の
# ままでは拒否されます。開発段階(タグ固定によるgit依存)では`main`追従より
# ずっと安全なので現状のままにしていますが、公開時は以下の手順を踏んで
# ください(詳しくはCONTRIBUTING.mdの「PyPI公開前の対応」を参照)。
#   1. MaiML-DomainをPyPIに先に公開する。
#   2. 下記dependenciesを次の形に書き換える(コメントアウトを外して
#      有効化し、上のgit+URL行を削除する):
#        dependencies = [
#            "maiml-domain>=0.2,<0.3",
#            "lxml>=4.9",
#        ]
#   3. その後にPyMaiML自体をPyPIへ公開する。
dependencies = [
    "maiml-domain @ git+https://github.com/MaiML-Library/MaiML-Domain.git@v0.2.0",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/MaiML-Library/PyMaiML"
Repository = "https://github.com/MaiML-Library/PyMaiML"

[tool.setuptools.packages.find]
include = ["pymaiml*"]

[tool.setuptools.package-data]
pymaiml = ["schema/MaiML-Schema-1_0/*.xsd", "schema/MaiML-Schema-1_0/*.txt"]
